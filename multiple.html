<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="icon" type="image/jpeg" href="productsimages/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/site_selector.js"></script>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="#home" class="logo">
                <img src="productsimages/logo.jpg" alt="Logo" loading="eager">
            </a>

            <nav class="nav-desktop">
                <a href="#products" class="nav-link">Products</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="refund-policy.html" class="nav-link">Refund Policy</a>
                <a href="refund-form.html" class="nav-link">Refund Form</a>
            </nav>

            <button class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="#products">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="refund-policy.html">Refund Policy</a>
        <a href="refund-form.html">Refund Form</a>
    </nav>

    <main id="home">
        <section class="hero" style="padding-bottom: 40px;">
            <div class="container hero-inner" style="grid-template-columns: 1fr;">
                <div class="hero-content" style="max-width: 820px;">
                    <div class="hero-badge" id="multi-badge">STORE</div>
                    <h1 class="hero-title" id="multi-title">Shop Products</h1>
                    <p class="hero-desc" id="multi-desc">Choose a product, view details, add to cart, and checkout securely.</p>
                </div>
            </div>
        </section>

        <section class="section" id="products" style="padding-top: 0;">
            <div class="container">
                <div class="section-head">
                    <h2 class="section-title">Products</h2>
                    <p class="section-subtitle">View details to see full description, specifications, images, and checkout.</p>
                </div>

                <div class="search-filter-bar">
                    <div class="search-input-wrap">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="search" id="multi-search" class="search-input" placeholder="Search products by name or description...">
                    </div>
                    <select id="multi-filter" class="filter-select">
                        <option value="">All Types</option>
                    </select>
                </div>
                <div id="multi-results-info" class="search-results-info owner-hidden"></div>

                <div id="multi-products-grid" class="packages-grid store-grid"></div>
                <div id="multi-products-empty" class="owner-hidden" style="padding: 24px; border: 1px solid var(--border); border-radius: 16px; background: #fff;">No products found.</div>
            </div>
        </section>
    </main>

    <script src="js/config2.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/multiple.js"></script>
</body>
</html>
